<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Campus Records Hub</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f5fa; margin: 0; color: #1d2733; }
    header { background: #274c77; color: #fff; padding: 18px 24px; }
    header h1 { margin: 0; font-size: 1.5rem; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border-radius: 8px; padding: 18px; margin-bottom: 20px; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
    form { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
    input { padding: 8px; border: 1px solid #b8c4d6; border-radius: 4px; }
    button { padding: 8px 14px; border: 0; border-radius: 4px; background: #274c77; color: #fff; cursor: pointer; }
    button.del { background: #b23a48; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 8px; border-bottom: 1px solid #e1e7f0; }
    #msg { color: #b23a48; min-height: 1.2em; margin-top: 8px; }
  </style>
</head>
<body>
  <header><h1>Campus Records Hub</h1></header>
  <main>
    <div class="card">
      <h2>Add a student</h2>
      <form id="form">
        <input id="name" placeholder="Name" required />
        <input id="email" type="email" placeholder="Email" required />
        <input id="course" placeholder="Course" required />
        <input id="year" type="number" min="1" max="6" placeholder="Year (1-6)" required />
        <button type="submit">Add</button>
      </form>
      <div id="msg"></div>
    </div>
    <div class="card">
      <h2>Students</h2>
      <table>
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Course</th><th>Year</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script>
    const rows = document.getElementById('rows');
    const msg = document.getElementById('msg');

    function cell(text) {
      const td = document.createElement('td');
      td.textContent = text;
      return td;
    }

    async function load() {
      const res = await fetch('/api/students');
      const list = await res.json();
      rows.innerHTML = '';
      list.forEach((s) => {
        const tr = document.createElement('tr');
        [s.id, s.name, s.email, s.course, s.year].forEach((v) => tr.appendChild(cell(v)));
        const td = document.createElement('td');
        const btn = document.createElement('button');
        btn.textContent = 'Delete';
        btn.className = 'del';
        btn.onclick = async () => { await fetch('/api/students/' + s.id, { method: 'DELETE' }); load(); };
        td.appendChild(btn);
        tr.appendChild(td);
        rows.appendChild(tr);
      });
    }

    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const body = {
        name: document.getElementById('name').value,
        email: document.getElementById('email').value,
        course: document.getElementById('course').value,
        year: document.getElementById('year').value
      };
      const res = await fetch('/api/students', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) { msg.textContent = (await res.json()).error; return; }
      e.target.reset();
      load();
    });

    load();
  </script>
</body>
</html>

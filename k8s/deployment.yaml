apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-mgmt-j9-deployment
  labels:
    app: student-mgmt-j9
spec:
  replicas: 2
  selector:
    matchLabels:
      app: student-mgmt-j9
  template:
    metadata:
      labels:
        app: student-mgmt-j9
    spec:
      containers:
        - name: student-mgmt-j9
          image: student-mgmt-j9:latest
          # Uses the image built locally by Docker Desktop (no registry needed)
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
